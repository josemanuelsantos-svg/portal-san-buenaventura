function App() {
  const [darkMode, setDarkMode] = useState(false);
  const [activeSection, setActiveSection] = useState('episodes');
  const [episodes, setEpisodes] = useState([]);
  const [prompts, setPrompts] = useState([]);
  const [sharedScripts, setSharedScripts] = useState([]);
  const [loading, setLoading] = useState(true);

  // Estado de Selección de Comunidad Autónoma / Ley Regional
  const [selectedRegion, setSelectedRegion] = useState(() => {
    return localStorage.getItem('aiudateca_selected_region') || 'nacional';
  });

  useEffect(() => {
    localStorage.setItem('aiudateca_selected_region', selectedRegion);
  }, [selectedRegion]);
  
  // Estados de Filtro
  const [selectedEpisodeId, setSelectedEpisodeId] = useState(null);
  const [searchQuery, setSearchQuery] = useState('');
  const [isRolling, setIsRolling] = useState(false);
  const [selectedCategory, setSelectedCategory] = useState('Todos');
  const [selectedGeminiStyle, setSelectedGeminiStyle] = useState('Todos');

  // Estados Premium (Favoritos, Progreso, Customizer y Toasts)
  const [favorites, setFavorites] = useState(() => {
    try {
      const saved = localStorage.getItem('aiudateca_favorites');
      return saved ? JSON.parse(saved) : [];
    } catch {
      return [];
    }
  });

  const [completedMissions, setCompletedMissions] = useState(() => {
    try {
      const saved = localStorage.getItem('aiudateca_completed_missions');
      return saved ? JSON.parse(saved) : [];
    } catch {
      return [];
    }
  });

  const [isAdmin, setIsAdmin] = useState(() => {
    return localStorage.getItem('aiudateca_is_admin') === 'true';
  });

  useEffect(() => {
    localStorage.setItem('aiudateca_is_admin', isAdmin ? 'true' : 'false');
  }, [isAdmin]);

  const [sectionVisibility, setSectionVisibility] = useState(() => {
    try {
      const saved = localStorage.getItem('aiudateca_visibility');
      return saved ? JSON.parse(saved) : {};
    } catch {
      return {};
    }
  });

  const [activeCustomizerPrompt, setActiveCustomizerPrompt] = useState(null);
  
  const [toast, setToast] = useState({ message: '', visible: false });

  // Guardar favoritos en LocalStorage
  useEffect(() => {
    localStorage.setItem('aiudateca_favorites', JSON.stringify(favorites));
  }, [favorites]);

  // Guardar misiones completadas en LocalStorage
  useEffect(() => {
    localStorage.setItem('aiudateca_completed_missions', JSON.stringify(completedMissions));
  }, [completedMissions]);

  // Carga de Datos
  useEffect(() => {
    async function loadData() {
      setLoading(true);
      try {
        const [loadedEpisodes, loadedPrompts, loadedScripts] = await Promise.all([
          getEpisodes(),
          getPrompts(),
          getSharedScripts()
        ]);
        const customPrompts = JSON.parse(localStorage.getItem('aiudateca_custom_prompts') || '[]');
        const customEpisodes = JSON.parse(localStorage.getItem('aiudateca_custom_episodes') || '[]');
        
        setEpisodes([...loadedEpisodes, ...customEpisodes]);
        setPrompts([...customPrompts, ...loadedPrompts]);
        setSharedScripts(loadedScripts);
      } catch (err) {
        console.error("Error al cargar datos en App: ", err);
      } finally {
        setLoading(false);
      }
    }
    loadData();
  }, []);

  // Sincronizar clase dark en HTML
  useEffect(() => {
    if (darkMode) {
      document.documentElement.classList.add('dark');
    } else {
      document.documentElement.classList.remove('dark');
    }
  }, [darkMode]);

  // Restaurar scroll al inicio al cambiar de pestaña
  useEffect(() => {
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }, [activeSection, selectedEpisodeId]);

  // Easter Egg: Do a Barrel Roll
  useEffect(() => {
    const query = searchQuery.trim().toLowerCase();
    if (query === 'do a barrel roll' || query === '/barrel-roll') {
      setIsRolling(true);
      const timer = setTimeout(() => {
        setIsRolling(false);
        setSearchQuery('');
      }, 1500);
      return () => clearTimeout(timer);
    }
  }, [searchQuery]);

  // Función para disparar notificaciones Toast (Snackbar)
  const showToast = (message) => {
    setToast({ message, visible: true });
  };

  useEffect(() => {
    if (toast.visible) {
      const timer = setTimeout(() => {
        setToast({ message: '', visible: false });
      }, 4000);
      return () => clearTimeout(timer);
    }
  }, [toast.visible]);

  // Manejar el toggle de favoritos
  const handleToggleFavorite = (promptId) => {
    setFavorites(prev => {
      const exists = prev.includes(promptId);
      if (exists) {
        showToast("Eliminado de tu biblioteca de favoritos.");
        return prev.filter(id => id !== promptId);
      } else {
        showToast("¡Añadido a tus favoritos! ⭐");
        return [...prev, promptId];
      }
    });
  };

  // Completar misión educativa automáticamente al seleccionar una tarjeta
  const handleSelectEpisode = (episodeId) => {
    setSelectedEpisodeId(episodeId);
    if (episodeId && !completedMissions.includes(episodeId)) {
      setCompletedMissions(prev => [...prev, episodeId]);
      showToast("¡Has desbloqueado una nueva Misión Educativa! 🎓");
      if (window.confetti) {
        window.confetti({
          particleCount: 100,
          spread: 60,
          origin: { y: 0.6 }
        });
      }
    }
  };

  // Lista de categorías únicas
  const categories = useMemo(() => {
    const cats = ['Todos'];
    prompts.forEach(p => {
      if (p.category && !cats.includes(p.category)) {
        cats.push(p.category);
      }
    });
    return cats;
  }, [prompts]);

  // Contador de prompts por estilo para el panel visual
  const promptsCountByStyle = useMemo(() => {
    const counts = {
      "Gemini Standard": 0,
      "Deep Research": 0,
      "Gemini Nano": 0,
      "Gemini Canvas": 0
    };
    prompts.forEach(p => {
      if (counts[p.geminiStyle] !== undefined) {
        counts[p.geminiStyle]++;
      }
    });
    return counts;
  }, [prompts]);

  // Lista de estilos de Gemini disponibles
  const geminiStyles = ['Todos', 'Gemini Standard', 'Deep Research', 'Gemini Nano', 'Gemini Canvas'];

  // Filtrado de Prompts según la sección activa y filtros generales
  const filteredPrompts = useMemo(() => {
    return prompts.filter((prompt) => {
      // Si estamos en la sección de favoritos, solo mostrar marcados
      if (activeSection === 'favorites') {
        if (!favorites.includes(prompt.id)) return false;
      } else {
        // En sección normal, filtrar por Misión seleccionada
        if (selectedEpisodeId && prompt.episodeId !== selectedEpisodeId) {
          return false;
        }
      }
      
      // Filtro por Categoría
      if (selectedCategory !== 'Todos' && prompt.category !== selectedCategory) {
        return false;
      }

      // Filtro por Estilo de Gemini
      if (selectedGeminiStyle !== 'Todos' && prompt.geminiStyle !== selectedGeminiStyle) {
        return false;
      }

      // Filtro por Búsqueda de Texto
      if (searchQuery.trim()) {
        const query = searchQuery.toLowerCase();
        const matchTitle = prompt.title.toLowerCase().includes(query);
        const matchContent = prompt.content.toLowerCase().includes(query);
        const matchTags = prompt.tags.some(tag => tag.toLowerCase().includes(query));
        const matchCategory = prompt.category.toLowerCase().includes(query);
        const matchStyle = prompt.geminiStyle.toLowerCase().includes(query);
        return matchTitle || matchContent || matchTags || matchCategory || matchStyle;
      }

      return true;
    });
  }, [prompts, activeSection, selectedEpisodeId, selectedCategory, selectedGeminiStyle, searchQuery, favorites]);

  const handleCtaClick = () => {
    setActiveSection('prompts');
    // Scroll suave
    const el = document.getElementById('search-anchor');
    if (el) el.scrollIntoView({ behavior: 'smooth' });
  };

  const handleSeedDatabase = async () => {
    if (confirm("¿Deseas inicializar la base de datos de Firestore con los episodios, prompts y scripts predeterminados?")) {
      const success = await seedFirestore();
      if (success) {
        showToast("¡Base de datos Firestore sembrada con éxito! Recargando datos...");
        const [loadedEpisodes, loadedPrompts, loadedScripts] = await Promise.all([
          getEpisodes(),
          getPrompts(),
          getSharedScripts()
        ]);
        setEpisodes(loadedEpisodes);
        setPrompts(loadedPrompts);
        setSharedScripts(loadedScripts);
      } else {
        showToast("No se pudo sembrar la base de datos. Verifica conexión.");
      }
    }
  };

  const handleAddScript = async (newScript) => {
    const success = await addSharedScript(newScript);
    if (success) {
      showToast("¡Script compartido con éxito! 🚀");
      const updated = await getSharedScripts();
      setSharedScripts(updated);
    } else {
      showToast("Hubo un problema al subir tu script.");
    }
  };

  return (
    <div className={`flex flex-col md:flex-row min-h-screen bg-google-gray-bg dark:bg-google-gray-darkBg text-google-gray-text dark:text-white transition-colors duration-250 ${isRolling ? 'barrel-roll-effect' : ''}`}>
      
      <style>{`
        @keyframes barrelRoll {
          0% { transform: rotate(0deg); }
          100% { transform: rotate(360deg); }
        }
        .barrel-roll-effect {
          animation: barrelRoll 1.5s cubic-bezier(0.42, 0, 0.58, 1) 1;
        }
      `}</style>
      
      {/* 1. Sidebar / Navigation Drawer */}
      <Sidebar 
        darkMode={darkMode}
        setDarkMode={setDarkMode}
        activeSection={activeSection}
        setActiveSection={setActiveSection}
        completedMissionsCount={completedMissions.length}
        totalMissionsCount={episodes.length}
        favoritesCount={favorites.length}
        isAdmin={isAdmin}
        setIsAdmin={setIsAdmin}
        sectionVisibility={sectionVisibility}
      />

      {/* 2. Área de Contenido Principal */}
      <div className="flex-1 flex flex-col justify-between overflow-x-hidden min-h-screen">
        
        <div>
          {/* Top Header Bar */}
          <header className="relative md:sticky md:top-0 bg-white/95 dark:bg-[#131518]/95 backdrop-blur-md border-b border-google-gray-border/20 dark:border-google-gray-darkInput/40 px-4 sm:px-8 py-3.5 sm:py-5 flex flex-row items-center justify-between z-30 transition-colors duration-200">
            <div className="flex items-center gap-3.5">
              <img 
                src="gemini.png" 
                alt="Logo" 
                className="w-11 h-11 rounded-xl object-cover border border-google-gray-border/15 dark:border-google-gray-darkInput/40 shadow-md"
              />
              <div>
                <h2 className="text-xs sm:text-sm font-black text-google-gray-text dark:text-white uppercase tracking-wider flex items-center gap-1.5">
                  <span className="text-google-gray-textSec dark:text-[#c7c7c7]">Programa:</span>
                  <span className="bg-gradient-to-r from-google-blue via-purple-500 via-google-red to-google-yellow bg-clip-text text-transparent font-black normal-case text-sm sm:text-base">
                    Con la AIuda de Gemini
                  </span>
                </h2>
              </div>
            </div>
            
            {/* Lado Derecho: Estado de DB y Botones */}
            <div className="flex items-center gap-3">
              {isFirebaseActive && (
                <button 
                  onClick={handleSeedDatabase}
                  className="flex items-center gap-1.5 px-3 py-1 rounded-full bg-google-blue-light hover:bg-google-blue/15 text-google-blue dark:bg-google-blue/20 dark:text-[#8ab4f8] text-[9px] font-black transition-all cursor-pointer"
                  title="Sincronizar base de datos"
                >
                  <span className="material-symbols-outlined text-xs animate-spin">sync</span>
                  <span>Sembrar Datos</span>
                </button>
              )}
              {/* Selector de Ley Autonómica de España */}
              <div className="flex items-center gap-1.5 bg-google-gray-bg dark:bg-[#202124] border border-google-gray-border/30 dark:border-[#3c4043] rounded-full px-2.5 py-1 text-[9px] sm:text-xs font-bold text-google-gray-text dark:text-white transition-all hover:bg-google-gray-bg/85 relative">
                <span className="material-symbols-outlined text-[13px] text-google-blue-medium select-none">account_balance</span>
                <span className="hidden lg:inline text-[9px] font-black uppercase text-google-gray-textSec dark:text-google-gray-border mr-0.5">Marco LOMLOE:</span>
                <select
                  value={selectedRegion}
                  onChange={(e) => {
                    const val = e.target.value;
                    setSelectedRegion(val);
                    showToast(`Marco legislativo adaptado a: ${REGIONAL_LAWS[val].name} 🇪🇸`);
                  }}
                  className="bg-transparent text-[9px] sm:text-xs font-black outline-none border-none cursor-pointer text-google-gray-text dark:text-white pr-1 focus:ring-0"
                >
                  {Object.values(REGIONAL_LAWS).map((law) => (
                    <option key={law.id} value={law.id} className="text-google-gray-text bg-white dark:bg-google-gray-darkSurface dark:text-white font-semibold">
                      {law.flag} {law.name}
                    </option>
                  ))}
                </select>
              </div>

              <div className="flex items-center gap-1.5 px-3 py-1 rounded-full border border-google-gray-border/30 dark:border-[#3c4043] text-[9px] font-bold text-google-gray-textSec dark:text-[#c7c7c7] bg-google-gray-bg dark:bg-[#202124]">
                <span className={`w-1.5 h-1.5 rounded-full ${isFirebaseActive ? 'bg-google-green animate-pulse' : 'bg-google-yellow'}`} />
                <span>{isFirebaseActive ? 'Firestore Online' : 'Local Offline'}</span>
              </div>
            </div>
          </header>

          {/* Hero Section */}
          {activeSection === 'episodes' && !selectedEpisodeId && (
            <HeroSection onCtaClick={handleCtaClick} />
          )}

          <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">

            {/* SECCIÓN 1: ÚLTIMAS MISIONES (EPISODIOS) */}
            {activeSection === 'episodes' && (
              <div className="space-y-10">
                {!selectedEpisodeId && (
                  <MainDashboardHub 
                    episodes={episodes}
                    selectedEpisodeId={selectedEpisodeId}
                    onSelectEpisode={handleSelectEpisode}
                    activeStyleFilter={selectedGeminiStyle}
                    onSelectStyleFilter={setSelectedGeminiStyle}
                    promptsCountByStyle={promptsCountByStyle}
                  />
                )}

                <MissionsGrid 
                  episodes={episodes}
                  selectedEpisodeId={selectedEpisodeId}
                  onSelectEpisode={handleSelectEpisode}
                />

                {/* Grid de Prompts del Episodio */}
                <div className="border-t border-google-gray-border/20 dark:border-google-gray-darkInput pt-8">
                  <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-8">
                    <div>
                      <h3 className="text-lg sm:text-xl font-bold text-google-gray-text dark:text-white flex items-center gap-2">
                        <span className="material-symbols-outlined text-google-blue-medium select-none">folder_open</span>
                        {selectedEpisodeId 
                          ? `Recursos de la Misión 0${episodes.find(e => e.id === selectedEpisodeId)?.number || ''}` 
                          : "Librería General de Prompts"}
                      </h3>
                      <p className="text-google-gray-textSec dark:text-google-gray-border text-sm">
                        {selectedEpisodeId 
                          ? "Instrucciones de Inteligencia Artificial tratadas en el episodio."
                          : "Navega por todos los prompts desarrollados para docentes."}
                      </p>
                    </div>
                    
                    {/* Buscador de barra */}
                    <div className="relative w-full sm:w-72">
                      <span className="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-[18px] text-google-gray-textSec">search</span>
                      <input 
                        type="text" 
                        placeholder="Buscar en esta misión..." 
                        value={searchQuery}
                        onChange={(e) => setSearchQuery(e.target.value)}
                        className="w-full pl-9 pr-4 py-2 rounded-full text-sm border border-google-gray-border/60 dark:border-google-gray-darkInput bg-white dark:bg-google-gray-darkSurface text-google-gray-text dark:text-white focus:outline-none focus:ring-1 focus:ring-google-blue"
                      />
                    </div>
                  </div>

                  {loading ? (
                    <div className="flex flex-col items-center justify-center py-16 text-google-gray-textSec">
                      <span className="material-symbols-outlined text-3xl animate-spin text-google-blue mb-2">sync</span>
                      <span>Cargando prompts...</span>
                    </div>
                  ) : filteredPrompts.length > 0 ? (
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                      {filteredPrompts.map((prompt) => (
                        <PromptCard 
                          key={prompt.id} 
                          prompt={prompt} 
                          isFavorite={favorites.includes(prompt.id)}
                          onToggleFavorite={() => handleToggleFavorite(prompt.id)}
                          onCustomize={() => setActiveCustomizerPrompt(prompt)}
                          onToastMessage={showToast}
                        />
                      ))}
                    </div>
                  ) : (
                    <div className="text-center py-12 bg-white dark:bg-[#2d2d2d] border border-dashed border-google-gray-border/40 dark:border-google-gray-darkInput rounded-3xl p-6">
                      <span className="material-symbols-outlined text-4xl text-google-gray-textSec mb-2">search_off</span>
                      <h4 className="font-bold text-google-gray-text dark:text-white mb-1">Sin coincidencias</h4>
                      <p className="text-sm text-google-gray-textSec dark:text-google-gray-border">Ajusta el término de búsqueda o limpia los filtros.</p>
                    </div>
                  )}
                </div>
              </div>
            )}

            {/* SECCIÓN 2: BUSCADOR GENERAL DE PROMPTS */}
            {activeSection === 'prompts' && (
              <div id="search-anchor" className="space-y-8 animate-fade-in">
                {/* Buscador */}
                <div className="p-6 sm:p-8 bg-white dark:bg-google-gray-darkSurface rounded-3xl border border-google-gray-border/30 dark:border-google-gray-darkInput/40 shadow-sm">
                  <h2 className="text-xl sm:text-2xl font-bold text-google-gray-text dark:text-white mb-1.5 flex items-center gap-2">
                    <span className="material-symbols-outlined text-google-blue-medium select-none">search</span>
                    Buscador de Prompts
                  </h2>
                  <p className="text-google-gray-textSec dark:text-google-gray-border text-sm mb-6">
                    Filtra por asignatura, nivel educativo o palabras clave del prompt.
                  </p>

                  {/* Input de Búsqueda */}
                  <div className="google-search-bar flex items-center h-14 px-4 mb-6">
                    <span className="material-symbols-outlined text-google-gray-textSec dark:text-[#c7c7c7] mr-3">search</span>
                    <input
                      type="text"
                      placeholder="Escribe 'evaluación', 'Deep Research', 'Canvas', 'rúbricas'..."
                      value={searchQuery}
                      onChange={(e) => setSearchQuery(e.target.value)}
                      className="w-full bg-transparent text-google-gray-text dark:text-white font-medium placeholder-google-gray-textSec/60 focus:outline-none text-base"
                    />
                    {searchQuery && (
                      <button 
                        onClick={() => setSearchQuery('')}
                        className="w-8 h-8 rounded-full flex items-center justify-center icon-btn-hover text-google-gray-textSec"
                      >
                        <span className="material-symbols-outlined text-lg">close</span>
                      </button>
                    )}
                  </div>

                  {/* Fila 1 de Chips: Estilos de Gemini */}
                  <div className="flex flex-col gap-2 mb-4">
                    <span className="text-xs font-bold uppercase tracking-wider text-google-gray-textSec dark:text-[#c7c7c7] flex items-center gap-1">
                      <span className="material-symbols-outlined text-sm text-google-blue-medium select-none">auto_awesome</span>
                      Estilo de Gemini:
                    </span>
                    <div className="flex flex-wrap gap-2">
                      {geminiStyles.map((style) => (
                        <button
                          key={style}
                          onClick={() => setSelectedGeminiStyle(style)}
                          className={`px-4 py-2 rounded-full text-xs font-bold border transition-all ${
                            selectedGeminiStyle === style
                              ? 'bg-google-blue-light text-google-blue border-transparent dark:bg-google-blue/25 dark:text-[#8ab4f8]'
                              : 'bg-white hover:bg-google-gray-bg border-google-gray-border/60 text-google-gray-textSec dark:bg-google-gray-darkSurface dark:hover:bg-google-gray-darkInput dark:border-google-gray-darkInput dark:text-google-gray-border'
                          }`}
                        >
                          {style}
                        </button>
                      ))}
                    </div>
                  </div>

                  {/* Fila 2 de Chips: Categorías */}
                  <div className="flex flex-col gap-2">
                    <span className="text-xs font-bold uppercase tracking-wider text-google-gray-textSec dark:text-[#c7c7c7] flex items-center gap-1">
                      <span className="material-symbols-outlined text-sm text-google-blue-medium select-none">sell</span>
                      Filtrar por Categoría:
                    </span>
                    <div className="flex flex-wrap gap-2">
                      {categories.map((cat) => (
                        <button
                          key={cat}
                          onClick={() => setSelectedCategory(cat)}
                          className={`px-4 py-2 rounded-full text-xs font-bold border transition-all ${
                            selectedCategory === cat
                              ? 'bg-google-blue-light text-google-blue border-transparent dark:bg-google-blue/25 dark:text-[#8ab4f8]'
                              : 'bg-white hover:bg-google-gray-bg border-google-gray-border/60 text-google-gray-textSec dark:bg-google-gray-darkSurface dark:hover:bg-google-gray-darkInput dark:border-google-gray-darkInput dark:text-google-gray-border'
                          }`}
                        >
                          {cat}
                        </button>
                      ))}
                    </div>
                  </div>
                </div>

                {/* Grid de Resultados */}
                {loading ? (
                  <div className="flex flex-col items-center justify-center py-16 text-google-gray-textSec">
                    <span className="material-symbols-outlined text-3xl animate-spin text-google-blue mb-2">sync</span>
                    <span>Cargando biblioteca de prompts...</span>
                  </div>
                ) : filteredPrompts.length > 0 ? (
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                    {filteredPrompts.map((prompt) => (
                      <PromptCard 
                        key={prompt.id} 
                        prompt={prompt} 
                        isFavorite={favorites.includes(prompt.id)}
                        onToggleFavorite={() => handleToggleFavorite(prompt.id)}
                        onCustomize={() => setActiveCustomizerPrompt(prompt)}
                        onToastMessage={showToast}
                      />
                    ))}
                  </div>
                ) : (
                  <div className="text-center py-16 bg-white dark:bg-[#2d2d2d] border border-dashed border-google-gray-border/40 dark:border-[#3c4043] rounded-3xl p-8">
                    <span className="material-symbols-outlined text-4xl text-google-gray-textSec mb-2">search_off</span>
                    <h4 className="text-lg font-bold text-google-gray-text dark:text-white mb-1">No se encontraron resultados</h4>
                    <p className="text-sm text-google-gray-textSec dark:text-[#c7c7c7] max-w-md mx-auto">
                      Prueba con palabras alternativas o selecciona 'Todos' en las categorías y estilos arriba.
                    </p>
                  </div>
                )}
              </div>
            )}

            {/* SECCIÓN 3: BIBLIOTECA DE FAVORITOS */}
            {activeSection === 'favorites' && (
              <div className="space-y-8 animate-fade-in">
                <div>
                  <h2 className="text-xl sm:text-2xl font-bold text-google-gray-text dark:text-white mb-1.5 flex items-center gap-2">
                    <span className="material-symbols-outlined text-google-yellow select-none" style={{ fontVariationSettings: "'FILL' 1" }}>star</span>
                    Mis Prompts Favoritos
                  </h2>
                  <p className="text-google-gray-textSec dark:text-[#c7c7c7] text-sm">
                    Acceso rápido a las plantillas y recursos que has guardado para tu aula.
                  </p>
                </div>

                {filteredPrompts.length > 0 ? (
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                    {filteredPrompts.map((prompt) => (
                      <PromptCard 
                        key={prompt.id} 
                        prompt={prompt} 
                        isFavorite={favorites.includes(prompt.id)}
                        onToggleFavorite={() => handleToggleFavorite(prompt.id)}
                        onCustomize={() => setActiveCustomizerPrompt(prompt)}
                        onToastMessage={showToast}
                      />
                    ))}
                  </div>
                ) : (
                  <div className="text-center py-16 bg-white dark:bg-[#2d2d2d] border border-dashed border-google-gray-border/40 dark:border-google-gray-darkInput rounded-3xl p-8">
                    <span className="material-symbols-outlined text-4xl text-google-gray-textSec mb-2">star_outline</span>
                    <h4 className="text-lg font-bold text-google-gray-text dark:text-white mb-1">Biblioteca vacía</h4>
                    <p className="text-sm text-google-gray-textSec dark:text-[#c7c7c7] max-w-md mx-auto">
                      Haz clic en la estrella de cualquier prompt de la librería o misiones para guardarlo aquí y acceder sin conexión.
                    </p>
                  </div>
                )}
              </div>
            )}

            {/* SECCIÓN 4: GEMINI EN WORKSPACE */}
            {activeSection === 'workspace' && (
              <GeminiWorkspace />
            )}

            {/* SECCIÓN NUEVA: LABORATORIOS GOOGLE AI */}
            {activeSection === 'google_labs' && (
              <GoogleAILabs />
            )}

            {/* SECCIÓN 5: NOTEBOOKLM HUB */}
            {activeSection === 'notebooklm' && (
              <NotebookLMHub />
            )}

            {/* SECCIÓN 7: ASISTENTE DE PROMPTS (WIZARD) */}
            {activeSection === 'wizard' && (
              <PromptWizard 
                selectedRegion={selectedRegion}
                regionalLaw={REGIONAL_LAWS[selectedRegion]}
                onCopy={(text) => {
                  navigator.clipboard.writeText(text);
                  showToast("¡Prompt del asistente copiado con éxito! 📋");
                }} 
              />
            )}

            {/* SECCIÓN 10: GENERADOR DE RECURSOS */}
            {activeSection === 'generator' && (
              <ResourceGenerator 
                selectedRegion={selectedRegion}
                regionalLaw={REGIONAL_LAWS[selectedRegion]}
              />
            )}

            {/* SECCIÓN NUEVA: DISEÑO SDA CANVAS */}
            {activeSection === 'sda_canvas' && (
              <SdaCanvas 
                selectedRegion={selectedRegion}
                regionalLaw={REGIONAL_LAWS[selectedRegion]}
              />
            )}

            {/* SECCIÓN NUEVA: RUBRICALC */}
            {activeSection === 'rubricalc' && (
              <RubriCalc 
                selectedRegion={selectedRegion}
                regionalLaw={REGIONAL_LAWS[selectedRegion]}
              />
            )}

            {/* SECCIÓN 8: ACADEMIA GEMINI */}
            {activeSection === 'academy' && (
              <GeminiAcademy />
            )}

            {/* SECCIÓN 9: RECURSOS GOOGLE */}
            {activeSection === 'google_hub' && (
              <GoogleResourcesHub />
            )}

            {/* SECCIÓN 13: MURO COLABORATIVO */}
            {activeSection === 'collab_board' && (
              <CollaborativeBoard />
            )}

            {/* SECCIÓN 11: PANEL ADMIN */}
            {activeSection === 'admin' && (
              <AdminPanel 
                sectionVisibility={sectionVisibility}
                setSectionVisibility={setSectionVisibility}
                prompts={prompts}
                setPrompts={setPrompts}
                episodes={episodes}
                setEpisodes={setEpisodes}
              />
            )}

            {/* SECCIÓN 12: LABORATORIO EDTECH */}
            {activeSection === 'devlab' && (
              <DevLabSandbox />
            )}

            {/* SECCIÓN 6: APPS SCRIPT HUB */}
            {activeSection === 'appsscript' && (
              <AppsScriptHub 
                sharedScripts={sharedScripts}
                onAddScript={handleAddScript}
              />
            )}

            {/* SECCIÓN AI RETOS DE ROL (QUESTS) */}
            {activeSection === 'ai_quests' && (
              <AIQuests />
            )}

            {/* SECCIÓN AI CREADOR DE FLUJOS (FLOWS) */}
            {activeSection === 'ai_flows' && (
              <AIFlows />
            )}

          </div>
        </div>

        {/* Footer */}
        <footer className="w-full bg-white dark:bg-[#2d2d2d] border-t border-google-gray-border/20 dark:border-google-gray-darkInput py-8 text-center text-xs text-google-gray-textSec dark:text-[#c7c7c7] transition-colors duration-250">
          <div className="max-w-7xl mx-auto px-4 space-y-2">
            <p className="font-semibold text-google-gray-text dark:text-white">
              La AIudateca · Con la AIuda de Gemini © 2026
            </p>
            <p className="max-w-md mx-auto leading-normal text-google-gray-textSec/80">
              Una biblioteca educativa para llevar la Inteligencia Artificial al aula de forma práctica, ética y competente. Diseñado con ❤️ para docentes innovadores.
            </p>
            <div className="pt-2 flex items-center justify-center gap-1 text-google-gray-border">
              <span className="material-symbols-outlined text-[14px] text-google-red">favorite</span>
              <span>React + Tailwind CSS + Google Material Symbols</span>
            </div>
          </div>
        </footer>

      </div>

      {/* 3. Modal Personalizador Inteligente de Prompts */}
      {activeCustomizerPrompt && (
        <PromptCustomizerModal 
          prompt={activeCustomizerPrompt}
          selectedRegion={selectedRegion}
          regionalLaw={REGIONAL_LAWS[selectedRegion]}
          onClose={() => setActiveCustomizerPrompt(null)}
          onCopy={(customizedContent) => {
            navigator.clipboard.writeText(customizedContent);
            showToast("¡Prompt personalizado copiado con éxito! 📋");
            setActiveCustomizerPrompt(null);
          }}
        />
      )}

      {/* 4. Google Style Toast / Snackbar Notification */}
      {toast.visible && (
        <div className="fixed bottom-6 left-6 z-50 flex items-center justify-between gap-6 px-4 py-3 bg-[#323232] text-white rounded-xl shadow-lg border border-neutral-700/50 animate-fade-in text-sm max-w-sm">
          <span>{toast.message}</span>
          <button 
            onClick={() => setToast({ message: '', visible: false })} 
            className="text-google-blue-medium hover:underline font-bold text-xs uppercase cursor-pointer"
          >
            Cerrar
          </button>
        </div>
      )}

      {/* 5. Gemi Companion Floating Chatbot */}
      <GemiCompanion 
        selectedRegion={selectedRegion}
        regionalLaw={REGIONAL_LAWS[selectedRegion]}
        activeSection={activeSection}
        setActiveSection={setActiveSection}
      />

    </div>
  );
}

// --- INICIO DE ARCHIVO: main.jsx ---

ReactDOM.createRoot(document.getElementById('app-root')).render(
  <React.StrictMode>
    <App />
  </React.StrictMode>
);
  </script>
</body>
</html>
