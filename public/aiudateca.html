        if (arg instanceof Error) return arg.message + '\n' + arg.stack;
        if (typeof arg === 'object') return JSON.stringify(arg);

async function getEpisodes() {
  if (isFirebaseActive && db) {
    try {
      const querySnapshot = await getDocs(collection(db, "episodes"));
      const episodes = [];
      querySnapshot.forEach((doc) => {
        episodes.push({ id: doc.id, ...doc.data() });
      });
      if (episodes.length > 0) {
        return episodes.sort((a, b) => a.number - b.number);
      }
    } catch (e) {
      console.warn("Fallo al leer Firestore (episodes). Usando Mock Data.", e);
    }
  }
  return mockEpisodes;
}

        prompts.push({ id: doc.id, ...doc.data() });

// API de Variaciones del Claustro
async function getVariations(promptId) {
  // 1. Si Firebase está activo, consultar Firestore
  if (isFirebaseActive && db) {
    try {
      const q = query(collection(db, "variations"), where("promptId", "==", promptId));
      const querySnapshot = await getDocs(q);
      const variations = [];
      querySnapshot.forEach((doc) => {
        variations.push({ id: doc.id, ...doc.data() });
      });
      if (variations.length > 0) {
        return variations;
      }
    } catch (e) {
      console.warn("Error leyendo variaciones de Firestore. Usando respaldo.", e);
    }
  }

  // 2. Fallback: LocalStorage + MockVariations
  let localVariations = [];
  try {
    const saved = localStorage.getItem(`aiudateca_variations_${promptId}`);
    if (saved) {
      localVariations = JSON.parse(saved);
    }
  } catch (e) {
    console.error("Error al leer LocalStorage para variaciones", e);
  }

  const defaultVariations = mockVariations.filter(v => v.promptId === promptId);
  return [...defaultVariations, ...localVariations];
}

async function addVariation(promptId, newVar) {
  const variationRecord = {
    promptId,
    ...newVar,
    id: `var-${Date.now()}`
  };

  // 1. Si Firebase está activo, guardar en Firestore
  if (isFirebaseActive && db) {
    try {
      await addDoc(collection(db, "variations"), variationRecord);
      return true;
    } catch (e) {
      console.error("Fallo al guardar variación en Firestore. Guardando localmente.", e);
    }
  }

  // 2. Fallback: Guardar en LocalStorage
  try {
    const key = `aiudateca_variations_${promptId}`;
    const saved = localStorage.getItem(key);
    const list = saved ? JSON.parse(saved) : [];
    list.push(variationRecord);
    localStorage.setItem(key, JSON.stringify(list));
    return true;
  } catch (e) {
    console.error("Error al escribir variación en LocalStorage", e);
    return false;
  }
}

// Función para subir los datos Mock a Firestore (Seeding inicial)
async function seedFirestore() {
  if (!isFirebaseActive || !db) {
    console.warn("No se puede hacer seeding: Firebase no está configurado de forma activa.");
    return false;
  }
  try {
    const eps = await getDocs(collection(db, "episodes"));
    if (!eps.empty) {
      console.log("Firestore ya tiene datos de episodios. Saltando inicialización.");
      return false;
    }

    for (const ep of mockEpisodes) {
      await setDoc(doc(db, "episodes", ep.id), ep);
    }
    
    for (const pr of mockPrompts) {
      await setDoc(doc(db, "prompts", pr.id), pr);
    }

    // Sembrar Variaciones iniciales
    for (const v of mockVariations) {
      await addDoc(collection(db, "variations"), v);
    }

    // Sembrar Scripts iniciales
    for (const sc of mockScripts) {
      await setDoc(doc(db, "scripts", sc.id), sc);
    }

    console.log("Seeding completado con éxito en Firestore.");
    return true;
  } catch (error) {
    console.error("Error en seeding de Firestore:", error);
    return false;
  }
}

// --- INICIO DE ARCHIVO: PromptVariations.jsx ---

function PromptVariations({ promptId, onToastMessage }) {
  const [variations, setVariations] = useState([]);
  const [loading, setLoading] = useState(true);
  
  // Estados del Formulario
  const [author, setAuthor] = useState('');
  const [title, setTitle] = useState('');
  const [content, setContent] = useState('');
  const [isSubmitting, setIsSubmitting] = useState(false);
  const [showForm, setShowForm] = useState(false);
  const [copiedId, setCopiedId] = useState(null);

  // Cargar variaciones
  const loadVariations = async () => {
    setLoading(true);
    try {
      const data = await getVariations(promptId);
      setVariations(data);
    } catch (e) {
      console.error("Error al cargar variaciones: ", e);
    } finally {
      setLoading(false);
    }
  };

  useEffect(() => {
    loadVariations();
  }, [promptId]);

  // Manejar copia rápida
  const handleCopyVariation = async (varId, text) => {
    try {
      await navigator.clipboard.writeText(text);
      setCopiedId(varId);
      onToastMessage("¡Variación de prompt copiado con éxito! 📋");
      if (window.confetti) {
        window.confetti({
          particleCount: 50,
          spread: 40,
          origin: { y: 0.85 }
        });
      }
      setTimeout(() => setCopiedId(null), 2000);
    } catch (e) {
      console.error(e);
    }
  };

  // Enviar formulario
  const handleSubmit = async (e) => {
    e.preventDefault();
    if (!author.trim() || !title.trim() || !content.trim()) {
      alert("Por favor, rellena todos los campos.");
      return;
    }

    setIsSubmitting(true);
    try {
      const success = await addVariation(promptId, {
        author,
        title,
        content
      });

      if (success) {
        onToastMessage("¡Variación publicada en el claustro! 👥");
        if (window.confetti) {
          window.confetti({
            particleCount: 100,
            spread: 50,
            origin: { y: 0.85 }
          });
        }
        // Limpiar formulario y cerrar
        setAuthor('');
        setTitle('');
        setContent('');
        setShowForm(false);
        // Recargar listado
        await loadVariations();
      }
    } catch (err) {
      console.error(err);
    } finally {
      setIsSubmitting(false);
    }
  };

  return (
    <div className="mt-4 pt-4 border-t border-google-gray-bg dark:border-google-gray-darkInput/40 text-xs">
      
      {/* Cabecera Claustro */}
      <div className="flex items-center justify-between mb-4">
        <span className="font-bold text-google-gray-textSec dark:text-[#c7c7c7] flex items-center gap-1">
          <span className="material-symbols-outlined text-sm text-google-blue-medium select-none">forum</span>
          Variaciones de la Comunidad ({variations.length})
        </span>
        
        <button
          onClick={() => setShowForm(!showForm)}
          className="px-3 py-1 rounded-full border border-google-gray-border hover:bg-google-gray-bg dark:border-google-gray-darkInput dark:hover:bg-google-gray-darkSurface text-google-blue-medium dark:text-[#8ab4f8] font-semibold flex items-center gap-1 transition-all"
        >
          <span className="material-symbols-outlined text-[14px]">
            {showForm ? 'close' : 'add'}
          </span>
          <span>{showForm ? 'Cerrar' : 'Aportar Variación'}</span>
        </button>
      </div>

      {/* Formulario de Aportación */}
      {showForm && (
        <form onSubmit={handleSubmit} className="mb-4 p-4 rounded-2xl bg-google-gray-bg dark:bg-google-gray-darkSurface border border-google-gray-border/20 space-y-3 animate-scale-in">
          <h4 className="font-bold text-google-gray-text dark:text-white flex items-center gap-1">
            <span className="material-symbols-outlined text-sm text-google-green">edit_note</span>
            Aportar adaptación al Claustro
          </h4>
          
          <div className="grid grid-cols-2 gap-3">
            <div className="flex flex-col gap-1">
              <label className="font-bold text-google-gray-textSec dark:text-[#c7c7c7]">Tu Nombre/Cargo</label>
              <input
                type="text"
                placeholder="Ej: Prof. Silvia"
                value={author}
                onChange={(e) => setAuthor(e.target.value)}
                className="px-3 py-2 border border-google-gray-border/50 dark:border-google-gray-darkInput rounded-xl bg-white dark:bg-google-gray-darkBg text-google-gray-text dark:text-white focus:outline-none"
              />
            </div>
            
            <div className="flex flex-col gap-1">
              <label className="font-bold text-google-gray-textSec dark:text-[#c7c7c7]">Título de la Adaptación</label>
              <input
                type="text"
                placeholder="Ej: Versión para DUA"
                value={title}
                onChange={(e) => setTitle(e.target.value)}
                className="px-3 py-2 border border-google-gray-border/50 dark:border-google-gray-darkInput rounded-xl bg-white dark:bg-google-gray-darkBg text-google-gray-text dark:text-white focus:outline-none"
              />
            </div>
          </div>

          <div className="flex flex-col gap-1">
            <label className="font-bold text-google-gray-textSec dark:text-[#c7c7c7]">Cuerpo del Prompt Modificado</label>
            <textarea
              rows={3}
              placeholder="Introduce el texto completo del prompt adaptado..."
              value={content}
              onChange={(e) => setContent(e.target.value)}
              className="p-3 border border-google-gray-border/50 dark:border-google-gray-darkInput rounded-xl bg-white dark:bg-google-gray-darkBg text-google-gray-text dark:text-white font-mono text-xs focus:outline-none custom-scrollbar"
            />
          </div>

          <button
            type="submit"
            disabled={isSubmitting}
            className="w-full py-2 rounded-full bg-google-blue hover:bg-google-blue-hover text-white font-bold transition-all disabled:opacity-50"
          >
            {isSubmitting ? "Publicando..." : "Publicar en la Comunidad"}
          </button>
        </form>
      )}

      {/* Listado de Variaciones */}
      {loading ? (
        <div className="text-center py-2 text-google-gray-textSec">
          <span>Cargando comentarios...</span>
        </div>
      ) : variations.length > 0 ? (
        <div className="space-y-3 max-h-48 overflow-y-auto custom-scrollbar pr-1.5">
          {variations.map((v) => (
            <div key={v.id} className="p-3 bg-white dark:bg-[#3c4043]/50 rounded-xl border border-google-gray-border/20 shadow-sm flex flex-col justify-between hover:border-google-blue/30 transition-all">
              <div>
                <div className="flex items-center justify-between mb-1.5 font-bold">
                  <span className="text-google-gray-text dark:text-white">{v.title}</span>
                  <span className="text-google-gray-textSec dark:text-[#c7c7c7] font-semibold text-[10px]">
                    Por {v.author}
                  </span>
                </div>
                <pre className="font-mono text-[10px] text-google-gray-textSec dark:text-google-gray-border leading-relaxed bg-[#f8f9fa] dark:bg-[#202124] p-2 rounded-lg whitespace-pre-wrap select-all max-h-24 overflow-y-auto custom-scrollbar border border-google-gray-border/10">
                  {v.content}
                </pre>
              </div>

              {/* Botón de Copiado Rápido */}
              <button
                onClick={() => handleCopyVariation(v.id, v.content)}
                className={`mt-2 py-1 px-3 rounded-full font-bold text-[10px] flex items-center justify-center gap-1.5 border transition-all ${
                  copiedId === v.id
                    ? 'bg-[#1e8e3e] text-white border-transparent'
                    : 'bg-white hover:bg-google-gray-bg dark:bg-[#2d2d2d] dark:hover:bg-google-gray-darkSurface text-google-blue border-google-gray-border/50 dark:border-google-gray-darkInput'
                }`}
              >
                <span className="material-symbols-outlined text-xs leading-none">
                  {copiedId === v.id ? 'check' : 'content_copy'}
                </span>
                <span>{copiedId === v.id ? '¡Copiado!' : 'Copiar esta Variación'}</span>
              </button>
            </div>
          ))}
        </div>
      ) : (
        <div className="text-center py-4 bg-google-gray-bg dark:bg-google-gray-darkSurface rounded-xl border border-google-gray-border/10 text-google-gray-textSec">

        </div>
      )}

    </div>
  );
}

    const cleanHex = hex.replace('#', '');
    const r = parseInt(cleanHex.substring(0, 2), 16);
    const g = parseInt(cleanHex.substring(2, 4), 16);
    const b = parseInt(cleanHex.substring(4, 6), 16);
    
    const adjustBrightness = (r, g, b, factor) => {
      return {
        r: Math.min(255, Math.max(0, Math.round(r * factor))),
        g: Math.min(255, Math.max(0, Math.round(g * factor))),
        b: Math.min(255, Math.max(0, Math.round(b * factor)))
      };
    };
    
    const toHexStr = (c) => {
      const hex = c.toString(16);
      return hex.length === 1 ? '0' + hex : hex;
    };
    
    const rgbToHex = (rgb) => `#${toHexStr(rgb.r)}${toHexStr(rgb.g)}${toHexStr(rgb.b)}`;
    
    const brand = `#${cleanHex}`;
    const hover = rgbToHex(adjustBrightness(r, g, b, 0.8));
    const light = `rgba(${r}, ${g}, ${b}, 0.12)`;
    const darkActive = `rgba(${r}, ${g}, ${b}, 0.28)`;
    
    return { brand, hover, light, darkActive };
  };

  useEffect(() => {
    let brand, hover, light, darkActive;
    if (currentTheme === 'custom') {
      const palette = hexToMaterialPalette(customColor);
      brand = palette.brand;
      hover = palette.hover;
      light = palette.light;
      darkActive = palette.darkActive;
    } else {
      const themeObj = themes.find(t => t.id === currentTheme) || themes[0];
      brand = themeObj.brand;
      hover = themeObj.hover;
      light = themeObj.light;
      darkActive = themeObj.darkActive;
    }
    
    // Calcular contraste de luminancia relativa
    const cleanHex = brand.replace('#', '');
    const r = parseInt(cleanHex.substring(0, 2), 16);
    const g = parseInt(cleanHex.substring(2, 4), 16);
    const b = parseInt(cleanHex.substring(4, 6), 16);
    const a = [r, g, b].map(v => {
      v /= 255;
      return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4);
    });
    const luminance = a[0] * 0.2126 + a[1] * 0.7152 + a[2] * 0.0722;
    const textBrandColor = luminance > 0.48 ? '#202124' : '#ffffff';

    const root = document.documentElement;
    root.style.setProperty('--google-brand', brand);
    root.style.setProperty('--google-brand-hover', hover);
    root.style.setProperty('--google-brand-light', light);

function EpisodeCard({ episode, onSelect, isSelected }) {

    switch (icon) {
      case 'shield':
        return <span className="material-symbols-outlined text-[22px] text-google-blue-medium select-none">shield</span>;
      case 'key':
        return <span className="material-symbols-outlined text-[22px] text-[#b06000] select-none">vpn_key</span>;
      case 'crown':
        return <span className="material-symbols-outlined text-[22px] text-google-red select-none">workspace_premium</span>;
      default:
        return <span className="material-symbols-outlined text-[22px] text-google-green select-none">star</span>;
    }
  };

  const getBorderColor = (icon) => {
    if (isSelected) return 'border-google-blue dark:border-[#8ab4f8] bg-google-blue-light/10 dark:bg-google-blue/10 shadow-md ring-2 ring-google-blue/20 dark:ring-[#8ab4f8]/20';
    
    switch (icon) {
      case 'shield':
        return 'hover:border-google-blue-medium/40 border-google-gray-border/25 dark:border-google-gray-darkInput/40 hover:shadow-google-blue/5';
      case 'key':
        return 'hover:border-[#b06000]/40 border-google-gray-border/25 dark:border-google-gray-darkInput/40 hover:shadow-orange-500/5';
      case 'crown':
        return 'hover:border-google-red/40 border-google-gray-border/25 dark:border-google-gray-darkInput/40 hover:shadow-google-red/5';
      default:
        return 'hover:border-google-green/45 border-google-gray-border/25 dark:border-google-gray-darkInput/40 hover:shadow-emerald-500/5';
    }
  };

  return (
    <div 
      className={`bg-white dark:bg-google-gray-darkSurface rounded-3xl border p-6 cursor-pointer flex flex-col justify-between transition-all duration-350 hover:-translate-y-1 ${getBorderColor(episode.badgeIcon)}`}

      <div>

          <span className="text-[10px] font-black uppercase tracking-wider text-google-blue-medium dark:text-[#8ab4f8]">

          </div>
        </div>

        {/* Nivel Desbloqueado */}
        <div className="flex items-center gap-1.5 text-[10px] font-bold text-google-gray-textSec dark:text-[#c7c7c7] mb-2.5">
          <span className="w-1.5 h-1.5 rounded-full bg-google-green animate-pulse" />
          <span>{episode.levelName}</span>
        </div>

        {/* Título de la Misión */}
        <h3 className="text-sm font-extrabold text-google-gray-text dark:text-white leading-snug mb-2 group-hover:text-google-blue-medium dark:group-hover:text-[#8ab4f8] transition-colors line-clamp-1">
          {episode.title}

        {/* Descripción */}
        <p className="text-[11px] text-google-gray-textSec dark:text-google-gray-border line-clamp-3 mb-4 leading-relaxed">
          {episode.description}

function MainDashboardHub({ 
  episodes, 
  selectedEpisodeId, 
  onSelectEpisode, 
  activeStyleFilter, 
  onSelectStyleFilter,
  promptsCountByStyle
}) {
  
  // --- ESTADOS DEL REPRODUCTOR DE PODCAST ---
  const [isPlaying, setIsPlaying] = useState(false);
  const [playbackProgress, setPlaybackProgress] = useState(35); // Porcentaje de progreso
  const [currentTrackIndex, setCurrentTrackIndex] = useState(0);
  const [volume, setVolume] = useState(80);

  // Refs de Web Audio API
  const audioCtxRef = useRef(null);
  const gainNodeRef = useRef(null);
  const scheduleTimerRef = useRef(null);

  // Estados de Beat Lo-Fi Rítmico
  const [beatEnabled, setBeatEnabled] = useState(false);
  const beatTimerRef = useRef(null);
  const beatEnabledRef = useRef(beatEnabled);

  useEffect(() => {
    beatEnabledRef.current = beatEnabled;
  }, [beatEnabled]);

  const canvasRef = useRef(null);

  useEffect(() => {
    if (!isPlaying) return;
    
    const canvas = canvasRef.current;
    if (!canvas) return;
    
    const ctx = canvas.getContext('2d');
    let animationFrameId;
    let phase = 0;
    
    const render = () => {
      if (!canvas) return;
      
      const dpr = window.devicePixelRatio || 1;
      const rect = canvas.getBoundingClientRect();
      canvas.width = rect.width * dpr;
      canvas.height = rect.height * dpr;
      ctx.scale(dpr, dpr);
      
      const width = rect.width;
      const height = rect.height;
      
      ctx.clearRect(0, 0, width, height);
      
      const drawWave = (color, amplitude, speed, offset) => {
        ctx.beginPath();
        ctx.strokeStyle = color;
        ctx.lineWidth = 1.5;
        
        for (let x = 0; x < width; x++) {
          const y = height / 2 + Math.sin(x * 0.08 + phase * speed + offset) * amplitude * Math.sin(x / width * Math.PI);
          if (x === 0) {
            ctx.moveTo(x, y);
          } else {
            ctx.lineTo(x, y);
          }
        }
        ctx.stroke();
      };
      
      drawWave('rgba(66, 133, 244, 0.7)', 8, 1.8, 0);         // Azul
      drawWave('rgba(219, 68, 85, 0.6)', 6, 2.4, Math.PI / 3);  // Rojo
      drawWave('rgba(244, 180, 0, 0.5)', 4, 1.2, Math.PI / 1.5); // Amarillo
      drawWave('rgba(15, 157, 88, 0.55)', 5, 1.5, Math.PI);     // Verde
      
      phase += 0.05;
      animationFrameId = requestAnimationFrame(render);
    };
    
    render();
    
    return () => {
      cancelAnimationFrame(animationFrameId);
    };
  }, [isPlaying]);

  // Obtener el episodio del reproductor basado en el índice
  const playerEpisode = episodes[currentTrackIndex] || episodes[0] || {
    title: "Episodio Cargando...",
    description: "Cargando audio del programa...",
    airDate: "2026-06-25",
    number: 1
  };

  // Simulación de reproducción y sintonía real de audio
  useEffect(() => {
    let interval;
    if (isPlaying) {
      interval = setInterval(() => {
        setPlaybackProgress(prev => {
          if (prev >= 100) {
            setIsPlaying(false);
            return 0;
          }
          return prev + 0.4;
        });
      }, 1000);
    }
    return () => clearInterval(interval);
  }, [isPlaying]);

  // Manejar el ciclo de vida del sintetizador procedural de audio
  useEffect(() => {
    if (isPlaying) {
      startSynthesizer();
    } else {
      stopSynthesizer();
    }
    return () => stopSynthesizer();
  }, [isPlaying]);

  // Actualizar volumen del sintetizador en tiempo real
  useEffect(() => {
    if (gainNodeRef.current && audioCtxRef.current) {
      gainNodeRef.current.gain.setValueAtTime((volume / 100) * 0.12, audioCtxRef.current.currentTime);
    }
  }, [volume]);

  const playKickDrum = (ctx, mainGain) => {
    if (!ctx || ctx.state === 'suspended') return;
    try {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      
      osc.type = 'sine';
      osc.frequency.setValueAtTime(150, ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.12);
      
      gain.gain.setValueAtTime(0.18, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.12);
      
      osc.connect(gain);
      gain.connect(mainGain);
      
      osc.start(ctx.currentTime);
      osc.stop(ctx.currentTime + 0.15);
    } catch {}
  };

  const startSynthesizer = () => {
    try {
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      if (!AudioContext) return;

      const ctx = new AudioContext();
      audioCtxRef.current = ctx;

      const mainGain = ctx.createGain();
      mainGain.gain.setValueAtTime((volume / 100) * 0.12, ctx.currentTime);
      mainGain.connect(ctx.destination);
      gainNodeRef.current = mainGain;

      // 1. Hum de fondo de baja frecuencia
      const baseOsc = ctx.createOscillator();
      baseOsc.type = 'triangle';
      baseOsc.frequency.setValueAtTime(110, ctx.currentTime); 
      
      const baseGain = ctx.createGain();
      baseGain.gain.setValueAtTime(0.04, ctx.currentTime);
      
      baseOsc.connect(baseGain);
      baseGain.connect(mainGain);
      baseOsc.start();

      // 2. Campanillas aleatorias (pentatónica armónica)
      const playChime = () => {
        if (!audioCtxRef.current || ctx.state === 'suspended') return;
        
        const pentatonicScale = [220, 246.94, 293.66, 329.63, 392.00, 440, 493.88, 587.33, 659.25, 783.99];
        const randomFreq = pentatonicScale[Math.floor(Math.random() * pentatonicScale.length)];
        
        const chimeOsc = ctx.createOscillator();
        chimeOsc.type = 'sine';
        chimeOsc.frequency.setValueAtTime(randomFreq, ctx.currentTime);
        
        const chimeGain = ctx.createGain();
        chimeGain.gain.setValueAtTime(0, ctx.currentTime);
        chimeGain.gain.linearRampToValueAtTime(0.03, ctx.currentTime + 0.15);
        chimeGain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 3.0);
        
        chimeOsc.connect(chimeGain);
        chimeGain.connect(mainGain);
        chimeOsc.start();
        chimeOsc.stop(ctx.currentTime + 3.5);
        
        scheduleTimerRef.current = setTimeout(playChime, 1800 + Math.random() * 2200);
      };

      playChime();

      // 3. Compás de Beat Rítmico (120 BPM = cada 500ms)
      const playBeat = () => {
        if (!audioCtxRef.current || ctx.state === 'suspended') return;
        if (beatEnabledRef.current) {
          playKickDrum(ctx, mainGain);
        }
        beatTimerRef.current = setTimeout(playBeat, 500);
      };
      playBeat();

    } catch (e) {
      console.warn("Fallo al inicializar Web Audio:", e);
    }
  };

  const stopSynthesizer = () => {
    if (scheduleTimerRef.current) {
      clearTimeout(scheduleTimerRef.current);
      scheduleTimerRef.current = null;
    }
    if (beatTimerRef.current) {
      clearTimeout(beatTimerRef.current);
      beatTimerRef.current = null;
    }
    if (audioCtxRef.current) {
      try {
        audioCtxRef.current.close();
      } catch {}
      audioCtxRef.current = null;
    }
    gainNodeRef.current = null;
  };

  const togglePlay = () => {
    setIsPlaying(!isPlaying);
  };

  const handleNextTrack = () => {
    setCurrentTrackIndex(prev => (prev + 1) % episodes.length);
    setPlaybackProgress(0);
  };

  const handlePrevTrack = () => {
    setCurrentTrackIndex(prev => (prev - 1 + episodes.length) % episodes.length);
    setPlaybackProgress(0);
  };

  const formatTime = (percentage) => {
    const totalSeconds = 24 * 60; // 24 mins
    const currentSeconds = Math.floor((percentage / 100) * totalSeconds);
    
    const format = (secs) => {
      const m = Math.floor(secs / 60);
      const s = secs % 60;
      return `${m}:${s < 10 ? '0' : ''}${s}`;
    };
    
    return {
      current: format(currentSeconds),
      total: format(totalSeconds)
    };
  };

  const times = formatTime(playbackProgress);

  const geminiStyles = [
    {
      id: "Gemini Standard",
      title: "Gemini Standard",
      subtitle: "Asistente General",

      icon: "smart_toy",
      colorClass: "border-google-blue/20 text-google-blue dark:text-[#8ab4f8] bg-google-blue-light/20 dark:bg-google-blue/5 hover:border-google-blue/40",
      activeColorClass: "bg-google-blue text-white shadow-lg shadow-google-blue/20 ring-2 ring-google-blue/30 scale-[1.01]",
      accentColor: "#0b57d0"
    },
    {
      id: "Deep Research",
      title: "Deep Research",
      subtitle: "Investigador Experto",
      description: "Diseñado para curar recursos REA, buscar evidencias en neuroeducación y contrastar bibliografías académicas verídicas.",
      icon: "manage_search",
      colorClass: "border-purple-500/20 text-purple-600 dark:text-purple-400 bg-purple-50/50 dark:bg-purple-950/5 hover:border-purple-500/40",
      activeColorClass: "bg-purple-600 text-white shadow-lg shadow-purple-600/20 ring-2 ring-purple-600/30 scale-[1.01]",
      accentColor: "#8b5cf6"
    },
    {
      id: "Gemini Nano",
      title: "Gemini Nano",
      subtitle: "Asistente Local/Móvil",
      description: "Prompts rápidos y de baja latencia optimizados para procesar resúmenes, recordatorios y alertas directamente en dispositivos móviles.",
      icon: "phone_android",
      colorClass: "border-orange-500/20 text-orange-600 dark:text-orange-400 bg-orange-50/50 dark:bg-orange-950/5 hover:border-orange-500/40",
      activeColorClass: "bg-orange-600 text-white shadow-lg shadow-orange-600/20 ring-2 ring-orange-600/30 scale-[1.01]",
      accentColor: "#f97316"
    },
    {

      subtitle: "Espacio de Edición",

      icon: "splitscreen",

      activeColorClass: "bg-google-green text-white shadow-lg shadow-google-green/20 ring-2 ring-google-green/30 scale-[1.01]",
      accentColor: "#34a853"
    }
  ];

  return (
    <div className="space-y-12">
      
      {/* 1. SECCIÓN: REPRODUCTOR DE PODCAST Y ESTADÍSTICAS */}
      <div className="grid grid-cols-1 lg:grid-cols-12 gap-8 items-stretch">
        
        {/* A. Reproductor Integrado (Estilo YouTube Music Premium) */}
        <div className="lg:col-span-7 bg-white dark:bg-google-gray-darkSurface rounded-[32px] border border-google-gray-border/25 dark:border-google-gray-darkInput p-6 sm:p-8 shadow-sm flex flex-col justify-between relative overflow-hidden group">
          {/* Fondo difuminado decorativo */}
          <div className="absolute top-0 right-0 w-40 h-40 bg-gradient-to-br from-google-red/10 to-transparent rounded-full blur-3xl pointer-events-none" />
          
          <div>
            <div className="flex items-center justify-between mb-6">

                <span className={`w-2 h-2 rounded-full ${isPlaying ? 'bg-google-red animate-ping' : 'bg-google-red'}`} />

                  {isPlaying ? 'Reproduciendo Episodio' : 'Podcast Educativo'}

              </div>
              <span className="text-[10px] font-bold text-google-gray-textSec dark:text-google-gray-border border border-google-gray-border/25 dark:border-google-gray-darkInput px-2.5 py-0.5 rounded-full bg-google-gray-bg dark:bg-google-gray-darkBg">
                Cap. {playerEpisode.number} de {episodes.length}

                    onChange={(e) => setStudentProfile(e.target.value)}

                  >
                    {profiles.map((prof, idx) => (
                      <option key={idx} value={prof}>{prof}</option>
                    ))}
                  </select>
                </div>
              </div>
            )}

            {/* PASO 2: TIPO DE RECURSO */}

                <div className="space-y-2.5 max-h-[280px] overflow-y-auto custom-scrollbar pr-1">

                    const isChecked = methodologies.includes(option.id);
                    return (
                      <div 
                        key={option.id}
                        onClick={() => handleCheckboxChange(option.id)}

                          isChecked 
                            ? 'border-google-blue bg-google-blue-light/20 dark:bg-google-blue/10' 
                            : 'border-google-gray-border/20 dark:border-[#3c4043] hover:border-google-gray-border/50'

                        <span className={`material-symbols-outlined text-sm mt-0.5 ${isChecked ? 'text-google-blue' : 'text-google-gray-border'}`}>

                        <div className="text-left">

                        </div>
                      </div>

                  })}
                </div>
              </div>
            )}

            {/* PASO 4: TONO Y ESTILO */}
            {step === 4 && (

                <h3 className="text-sm font-extrabold text-google-gray-text dark:text-white">Paso 4: Tono y Formato de Salida</h3>

                    {tones.map((t, idx) => (
                      <option key={idx} value={t}>{t}</option>

                <div className="flex flex-col gap-1.5">
                  <label className="text-xs font-bold text-google-gray-textSec dark:text-google-gray-border">Formato Visual</label>

                  >
                    {formats.map((f, idx) => (
                      <option key={idx} value={f}>{f}</option>

            {/* PASO 5: COMPETENCIAS Y OBJETIVOS DIDÁCTICOS */}

                <p className="text-[10px] text-google-gray-textSec dark:text-google-gray-border leading-relaxed">
                  Selecciona las Competencias Clave (LOMLOE) prioritarias. Se adaptarán con sus descriptores al nivel de <strong>{level}</strong>:
                </p>
                
                {/* Grid interactivo de competencias */}
                <div className="grid grid-cols-2 sm:grid-cols-4 gap-2">
                  {LOMLOE_COMPETENCIES.map((comp) => {
                    const isSelected = selectedCompetencies.includes(comp.id);
                    const stageKey = getStageKey();
                    return (
                      <button
                        key={comp.id}
                        type="button"
                        onClick={() => {
                          if (isSelected) {
                            setSelectedCompetencies(selectedCompetencies.filter(id => id !== comp.id));
                          } else {
                            setSelectedCompetencies([...selectedCompetencies, comp.id]);
                          }
                        }}
                        title={comp.desc[stageKey]}
                        className={`p-2.5 rounded-xl border text-left transition-all relative flex flex-col justify-between h-[68px] ${
                          isSelected
                            ? 'border-google-blue bg-google-blue-light/25 text-google-blue dark:bg-google-blue/10 dark:text-[#8ab4f8]'
                            : 'border-google-gray-border/30 dark:border-google-gray-darkInput text-google-gray-text dark:text-[#c7c7c7] hover:bg-google-gray-bg dark:hover:bg-[#3c4043]'
                        }`}
                      >
                        <span className="text-base select-none">{comp.flag}</span>
                        <div className="flex flex-col overflow-hidden w-full">
                          <span className="text-[8px] font-black tracking-wide leading-tight truncate">{comp.name}</span>
                          <span className="text-[7px] text-google-gray-textSec dark:text-google-gray-border leading-tight truncate mt-0.5">
                            {comp.desc[stageKey]}
                          </span>
                        </div>
                      </button>
                    );
                  })}
                </div>

                <div className="flex flex-col gap-1.5 pt-2">
                  <label className="text-xs font-bold text-google-gray-textSec dark:text-google-gray-border">Objetivos Didácticos Adicionales (Opcional)</label>
                  <textarea 
                    rows={3}
                    value={objectives}
                    onChange={(e) => setObjectives(e.target.value)}
                    placeholder="Ej: Que distingan entre clima y tiempo meteorológico..."
                    className="w-full px-4 py-3 rounded-xl border border-google-gray-border/60 dark:border-google-gray-darkInput bg-white dark:bg-google-gray-darkBg text-google-gray-text dark:text-white text-xs focus:outline-none resize-none"
                  />
                </div>
              </div>
            )}

            {/* PASO 6: FINALIZACIÓN */}
            {step === 6 && (
              <div className="space-y-4 animate-fade-in text-center py-6">
                <span className="material-symbols-outlined text-4xl text-google-green animate-bounce">task_alt</span>
                <div>
                  <h3 className="font-extrabold text-sm text-google-gray-text dark:text-white">¡Estructura de Prompt Terminada!</h3>
                  <p className="text-[10px] text-google-gray-textSec dark:text-[#c7c7c7] mt-1">Revisa el prompt refinado y haz clic en Copiar o Simular a la derecha.</p>

                <button

                  Modificar Parámetros

            {step < 6 && (
              <div className="flex justify-between items-center pt-4 border-t border-google-gray-border/10">
                <button
                  disabled={step === 1}
                  onClick={() => setStep(step - 1)}

                >
                  Anterior
                </button>
                
                {step < 5 ? (
                  <button
                    onClick={() => setStep(step + 1)}
                    className="px-5 py-2 rounded-full bg-google-blue hover:bg-google-blue-hover text-white text-xs font-bold shadow-sm transition-all"

                    Siguiente
                  </button>
                ) : (
                  <button
                    onClick={handleBuildPrompt}
                    className="px-6 py-2 rounded-full bg-google-green hover:bg-[#137333] text-white text-xs font-bold shadow-sm transition-all"
                  >
                    Generar Prompt Completo
                  </button>
                )}
              </div>
            )}

          </div>
        </div>

        {/* Columna Derecha: Previsualización del Prompt y Sandbox (6 Columnas) */}
        <div className="lg:col-span-6 space-y-6">
          
          {/* Tarjeta del Prompt Generado */}
          <div className="bg-white dark:bg-google-gray-darkSurface rounded-3xl border border-google-gray-border/25 dark:border-google-gray-darkInput p-5 shadow-sm space-y-4">
            <div className="flex items-center justify-between">
              <span className="text-[10px] font-extrabold uppercase tracking-wider text-google-gray-textSec dark:text-[#c7c7c7]">
                Resultado del Prompt Pedagógico
              </span>
              {generatedPrompt && (
                <div className="flex items-center gap-3">
                  <button
                    onClick={() => handleCopyText(generatedPrompt, "¡Prompt copiado con éxito! 📋")}
                    className="text-google-blue-medium hover:underline text-[10px] font-bold flex items-center gap-0.5"
                  >
                    <span className="material-symbols-outlined text-xs">content_copy</span>
                    <span>Copiar</span>
                  </button>
                  <button
                    onClick={() => handleExportDoc("Prompt Pedagógico Diseñado", generatedPrompt)}
                    className="text-google-blue-medium hover:underline text-[10px] font-bold flex items-center gap-0.5"
                  >
                    <span className="material-symbols-outlined text-xs">description</span>
                    <span>Exportar</span>
                  </button>
                  <a
                    href={`https://classroom.google.com/share?url=${encodeURIComponent('https://notebooklm.google.com')}&title=${encodeURIComponent(`[La AIudateca] Prompt Pedagógico Diseñado: ${topic}`)}`}
                    target="_blank"
                    rel="noopener noreferrer"
                    className="text-google-blue-medium hover:underline text-[10px] font-bold flex items-center gap-0.5"
                    title="Compartir Prompt en Google Classroom"
                  >
                    <span className="material-symbols-outlined text-xs">school</span>
                    <span>Compartir</span>
                  </a>
                </div>
              )}
            </div>

            <div className="p-4 bg-google-gray-bg dark:bg-google-gray-darkBg rounded-2xl border border-google-gray-border/20 min-h-[160px] max-h-[220px] overflow-y-auto custom-scrollbar relative shadow-inner">
              {generatedPrompt ? (
                <pre className="text-[10px] font-mono text-google-gray-text dark:text-slate-350 whitespace-pre-wrap leading-relaxed select-all">
                  {generatedPrompt}
                </pre>
              ) : (
                <div className="flex flex-col items-center justify-center h-28 text-center text-google-gray-textSec/50">
                  <span className="material-symbols-outlined text-2xl mb-1">description</span>
                  <span className="text-[10px]">Estructura los 5 pasos para obtener el prompt óptimo.</span>
                </div>
              )}
            </div>

            {generatedPrompt && (
              <div className="space-y-4 pt-2">
                <button
                  onClick={handleExecuteSandbox}
                  disabled={sandboxLoading}
                  className="w-full py-3.5 rounded-full bg-google-green hover:bg-[#137333] text-white font-bold text-xs shadow-sm flex items-center justify-center gap-1.5 transition-all"
                >
                  {sandboxLoading ? (
                    <>
                      <span className="material-symbols-outlined text-sm animate-spin">sync</span>
                      <span>Generando recurso instruccional...</span>
                    </>
                  ) : (
                    <>
                      <span className="material-symbols-outlined text-sm">smart_toy</span>
                      <span>{apiKey ? 'Ejecutar en Sandbox (Online)' : 'Simular Ejecución (Modo Demo)'}</span>
                    </>
                  )}
                </button>
              </div>
            )}
          </div>

          {/* Tarjeta de Salida de Documento del Sandbox */}
          {sandboxResult || sandboxLoading ? (
            <div className="bg-white dark:bg-google-gray-darkSurface rounded-3xl border border-google-gray-border/25 dark:border-google-gray-darkInput p-5 shadow-sm space-y-3 animate-fade-in">
              <div className="flex items-center justify-between border-b border-google-gray-border/10 pb-2">
                <span className="text-[9px] font-extrabold uppercase tracking-wider text-google-gray-textSec dark:text-[#c7c7c7] flex items-center gap-1">
                  <span className="w-2.5 h-2.5 rounded-full bg-google-green animate-pulse" />
                  Vista Previa del Documento Generado
                </span>
                {sandboxResult && (
                  <div className="flex items-center gap-3">
                    <button
                      onClick={() => handleCopyText(sandboxResult, "¡Recurso copiado! 📋")}
                      className="text-google-green hover:underline text-[10px] font-bold flex items-center gap-0.5"
                    >
                      <span className="material-symbols-outlined text-xs">content_copy</span>
                      <span>Copiar</span>
                    </button>
                    <button
                      onClick={() => handleExportDoc("Recurso Didáctico Generado", sandboxResult)}
                      className="text-google-green hover:underline text-[10px] font-bold flex items-center gap-0.5"
                    >
                      <span className="material-symbols-outlined text-xs">description</span>
                      <span>Exportar</span>
                    </button>
                    <a
                      href={`https://classroom.google.com/share?url=${encodeURIComponent('https://notebooklm.google.com')}&title=${encodeURIComponent(`[La AIudateca] Recurso Didáctico: ${topic}`)}`}
                      target="_blank"
                      rel="noopener noreferrer"
                      className="text-google-green hover:underline text-[10px] font-bold flex items-center gap-0.5"
                      title="Compartir Recurso en Google Classroom"
                    >
                      <span className="material-symbols-outlined text-xs">school</span>
                      <span>Compartir</span>
                    </a>
                  </div>
                )}
              </div>

              <div className="p-4 bg-[#f8f9fa] dark:bg-[#202124] border border-[#dadce0] dark:border-[#3c4043] rounded-2xl relative shadow-inner min-h-[160px] max-h-[300px] overflow-y-auto custom-scrollbar text-left">
                {sandboxLoading ? (
                  <div className="flex flex-col items-center justify-center h-28 space-y-2">
                    <div className="w-32 h-1 bg-google-gray-bg dark:bg-[#3c4043] rounded-full overflow-hidden">
                      <div className="h-full bg-google-green rounded-full animate-gradient-pulse" style={{ width: '50%' }} />
                    </div>
                    <span className="text-[9px] font-bold text-google-gray-textSec dark:text-google-gray-border">Generando documento escolar...</span>
                  </div>
                ) : (
                  <pre className="text-[10px] font-sans text-google-gray-text dark:text-slate-350 whitespace-pre-wrap break-words leading-relaxed select-all">
                    {sandboxResult}
                  </pre>
                )}
              </div>
            </div>
          ) : null}

          {/* Matriz de Rúbrica Editable (M3) */}
          {showRubricTable && wizardRubricRows.length > 0 && !sandboxLoading && (
            <div className="bg-white dark:bg-google-gray-darkSurface rounded-3xl border border-google-gray-border/25 dark:border-google-gray-darkInput p-5 shadow-sm space-y-4 animate-fade-in text-left">
              <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4 border-b border-google-gray-border/10 pb-3">
                <div>
                  <h3 className="font-extrabold text-xs text-google-gray-text dark:text-white flex items-center gap-1.5">
                    <span className="material-symbols-outlined text-google-green text-sm">table_chart</span>
                    Matriz Rúbrica LOMLOE Dinámica
                  </h3>
                  <p className="text-[9px] text-google-gray-textSec dark:text-[#c7c7c7]">
                    Edita las celdas en caliente para adaptar tus descriptores curriculares.
                  </p>
                </div>
                <button
                  onClick={handleExportWizardRubricCSV}
                  className="px-4 py-2 rounded-full border border-google-green text-google-green hover:bg-google-green/5 text-[10px] font-black flex items-center gap-1 transition-all"
                >
                  <span className="material-symbols-outlined text-xs leading-none">cloud_download</span>
                  <span>Exportar a Google Classroom (CSV)</span>
                </button>
              </div>

              <div className="overflow-x-auto rounded-2xl border border-google-gray-border/20">
                <table className="w-full text-left border-collapse text-[10px]">
                  <thead>
                    <tr className="bg-google-gray-bg dark:bg-google-gray-darkBg border-b border-google-gray-border/20 text-google-gray-text dark:text-white font-extrabold">
                      <th className="p-3 w-1/5">Criterio</th>
                      <th className="p-3 w-1/5">Excelente (4)</th>
                      <th className="p-3 w-1/5">Bueno (3)</th>
                      <th className="p-3 w-1/5">Desarrollo (2)</th>
                      <th className="p-3 w-1/5">Inicial (1)</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-google-gray-border/10">
                    {wizardRubricRows.map((row, rIdx) => (
                      <tr key={rIdx} className="hover:bg-google-gray-bg/30 dark:hover:bg-google-gray-darkBg/20">
                        <td className="p-3 font-extrabold text-google-gray-text dark:text-white">
                          <input
                            type="text"
                            value={row.criterio}
                            onChange={(e) => handleUpdateWizardRubricCell(rIdx, 'criterio', e.target.value)}
                            className="w-full bg-transparent border-0 focus:ring-1 focus:ring-google-blue rounded p-1 font-extrabold text-[10px]"
                          />
                        </td>
                        {['excelente', 'bueno', 'desarrollo', 'inicial'].map(field => (
                          <td key={field} className="p-3 text-google-gray-textSec dark:text-[#c7c7c7] align-top">
                            <textarea
                              value={row[field]}
                              onChange={(e) => handleUpdateWizardRubricCell(rIdx, field, e.target.value)}
                              rows={3}
                              className="w-full bg-transparent border-0 focus:ring-1 focus:ring-google-blue rounded p-1 resize-none text-[9px] leading-relaxed"
                            />
                          </td>
                        ))}
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </div>
          )}

        </div>

      </div>

    </div>
  );
}

                    }`}

                    <span className="material-symbols-outlined text-xs">{isPlayingSpeech ? 'stop' : 'volume_up'}</span>
                    <span>{isPlayingSpeech ? 'Detener' : 'Escuchar Voz'}</span>
                  </button>

                    onClick={() => {
                      navigator.clipboard.writeText(diffOutput);
                      if (window.confetti) window.confetti({ particleCount: 30, spread: 25 });

                    <span className="material-symbols-outlined text-xs">content_copy</span>
                    <span>Copiar</span>
                  </button>
                </div>
              )}

            <div className="p-5 bg-google-gray-bg dark:bg-google-gray-darkBg rounded-2xl border border-google-gray-border/25 min-h-[220px] max-h-[360px] overflow-y-auto custom-scrollbar relative shadow-inner text-left font-sans text-xs leading-relaxed">

                  <span className="text-[9px] font-bold text-google-gray-textSec dark:text-google-gray-border">Aplicando guías de accesibilidad DUA...</span>
                </div>
              ) : diffOutput ? (
                <div className="space-y-4 text-google-gray-text dark:text-slate-350 select-all">
                  {diffOutput.split('\n\n').map((paragraph, pIdx) => {
                    if (paragraph.startsWith('### ')) {
                      return <h4 key={pIdx} className="text-xs font-black text-google-blue-medium dark:text-[#8ab4f8]">{paragraph.replace('### ', '')}</h4>;
                    }
                    if (paragraph.startsWith('* ') || paragraph.startsWith('- ')) {
                      return (
                        <ul key={pIdx} className="list-disc pl-4 space-y-1">
                          {paragraph.split('\n').map((li, liIdx) => {
                            const cleanLi = li.replace(/^[*-\s]+/, '');
                            const parts = cleanLi.split('**');
                            return (
                              <li key={liIdx}>
                                {parts.map((part, partIdx) => partIdx % 2 === 1 ? <strong key={partIdx} className="font-extrabold text-google-gray-text dark:text-white">{part}</strong> : part)}
                              </li>
                            );
                          })}
                        </ul>
                      );
                    }
                    const parts = paragraph.split('**');
                    return (
                      <p key={pIdx}>
                        {parts.map((part, partIdx) => partIdx % 2 === 1 ? <strong key={partIdx} className="font-extrabold text-google-gray-text dark:text-white">{part}</strong> : part)}
                      </p>
                    );
                  })}
                </div>
              ) : (
                <div className="flex flex-col items-center justify-center h-48 text-center text-google-gray-textSec/50">
                  <span className="material-symbols-outlined text-3xl mb-1.5 select-none">accessibility_new</span>
                  <span className="text-[10px]">Ingresa el texto a la izquierda y selecciona el tipo de adaptación.</span>
                </div>
              )}
            </div>
          </div>
        </div>
      )}

    </div>
  );
}

function SdaCanvas({ selectedRegion, regionalLaw }) {
  const getStageKey = (gradeStr) => {
    const clean = (gradeStr || '').toLowerCase();
    if (clean.includes('infantil') || clean.includes('inf') || clean.includes('3 años') || clean.includes('4 años') || clean.includes('5 años') || clean.includes('ei')) return 'infantil';
    if (clean.includes('secundaria') || clean.includes('eso') || clean.includes('fp') || clean.includes('profesional') || clean.includes('º eso') || clean.includes('sec')) return 'secundaria';
    if (clean.includes('bachillerato') || clean.includes('bto') || clean.includes('superior') || clean.includes('universidad') || clean.includes('º bach') || clean.includes('bach')) return 'bachillerato';
    return 'primaria';
  };
  const [sdaTitle, setSdaTitle] = useState('Los Protectores del Ecosistema Local');
  const [sdaSubject, setSdaSubject] = useState('Conocimiento del Medio / Ciencias Naturales');
  const [sdaGrade, setSdaGrade] = useState('5º de Primaria');
  const [sdaDuration, setSdaDuration] = useState('8 sesiones (2 semanas)');
  const [sdaJustification, setSdaJustification] = useState('Esta SdA busca que el alumnado investigue las especies invasoras del entorno cercano y proponga una campaña de sensibilización vecinal aplicando los ODS.');
  const [sdaSaberes, setSdaSaberes] = useState('- Ecosistemas terrestres y acuáticos: relaciones de interdependencia.\n- Especies autóctonas e invasoras de la región: impacto ecológico.\n- Consumo responsable, biodiversidad y ODS (Vida de ecosistemas terrestres).\n- Trabajo en equipo y comunicación oral y digital.');

  // Listado predeterminado de fases SdA
  const [phases, setPhases] = useState([
    {
      id: 1,
      name: 'Fase 1: Activación (Motivación y Reto)',
      desc: 'Partimos de una noticia de prensa real local sobre una especie invasora detectada en un río de la comunidad. Hacemos un debate rápido con la rutina "Veo, Pienso, Me Pregunto" y planteamos la pregunta guía del reto cooperativo.',
      duaPrinciples: ['Compromiso - Captar el interés'],
      competencies: ['CCL', 'CC']
    },
    {
      id: 2,
      name: 'Fase 2: Investigación (Exploración de Fuentes)',
      desc: 'En grupos cooperativos de 4 alumnos (roles de Coordinador, Portavoz, Secretario y Diseñador), investigan la especie asignada en internet y elaboran una ficha de impacto ecológico utilizando NotebookLM.',
      duaPrinciples: ['Representación - Comprensión', 'Representación - Lenguaje y Símbolos'],
      competencies: ['STEM', 'CD', 'CPSAA']
    },
    {
      id: 3,
      name: 'Fase 3: Estructuración y Producto Final',
      desc: 'Los equipos diseñan un folleto digital interactivo o una infografía para Classroom donde explican el ciclo biológico de la especie invasora y proponen 3 acciones preventivas para los vecinos.',
      duaPrinciples: ['Acción/Expresión - Expresión y Comunicación'],
      competencies: ['CD', 'CE', 'CCEC']
    },
    {
      id: 4,
      name: 'Fase 4: Evaluación y Difusión (Metacognición)',
      desc: 'Presentación oral de los folletos al resto de la clase. Los grupos se coevalúan usando la rúbrica oficial en Classroom. Cada alumno redacta un diario de aprendizaje respondiendo a su autorregulación de esfuerzo.',
      duaPrinciples: ['Compromiso - Autorregulación', 'Acción/Expresión - Funciones ejecutivas'],
      competencies: ['CCL', 'CPSAA', 'CC']
    }
  ]);

  const [activePhaseId, setActivePhaseId] = useState(1);

  // Principios DUA disponibles
  const duaOptions = {
    compromiso: [
      'Compromiso - Captar el interés',
      'Compromiso - Mantener el esfuerzo y persistencia',
      'Compromiso - Autorregulación'
    ],
    representacion: [
      'Representación - Percepción',
      'Representación - Lenguaje y Símbolos',
      'Representación - Comprensión'
    ],
    expresion: [
      'Acción/Expresión - Acción física',
      'Acción/Expresión - Expresión y Comunicación',
      'Acción/Expresión - Funciones ejecutivas'
    ]
  };

  const handleUpdatePhaseText = (field, val) => {
    setPhases(phases.map(p => p.id === activePhaseId ? { ...p, [field]: val } : p));
  };

  const handleToggleDuaInPhase = (option) => {
    setPhases(phases.map(p => {
      if (p.id !== activePhaseId) return p;
      const exists = p.duaPrinciples.includes(option);
      return {
        ...p,
        duaPrinciples: exists 
          ? p.duaPrinciples.filter(item => item !== option) 
          : [...p.duaPrinciples, option]
      };
    }));
  };

  const handleToggleCompInPhase = (compId) => {
    setPhases(phases.map(p => {
      if (p.id !== activePhaseId) return p;
      const exists = p.competencies.includes(compId);

      md += `\n**Competencias Clave Priorizadas:**\n`;
      if (phase.competencies.length > 0) {
        phase.competencies.forEach(c => {
          const compData = LOMLOE_COMPETENCIES.find(item => item.id === c);
          md += `- **${compData ? compData.name : c}** (${compData ? compData.flag : ''})\n`;
        });
      } else {
        md += `- Ninguna seleccionada.\n`;
      }
      md += `\n---\n\n`;
    });
    
    md += `*Documento curricular programático generado de forma autónoma con el Canvas SdA de La AIudateca - Claustro de Profesores 🇪🇸*`;

    // Descarga del archivo
    const blob = new Blob([md], { type: 'text/markdown;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `SdA_${sdaTitle.toLowerCase().replace(/[^a-z0-9]+/g, '_')}.md`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    if (window.confetti) window.confetti({ particleCount: 80, spread: 50 });
  };

  const activePhase = phases.find(p => p.id === activePhaseId) || phases[0];

  return (

          <p className="text-google-gray-textSec dark:text-google-gray-border text-sm">
            Estructura las fases de tu lección, asigna principios DUA y asocia competencias del decreto de <strong>{regionalLaw ? `${regionalLaw.name} (${regionalLaw.decretos ? regionalLaw.decretos[getStageKey(sdaGrade)] : regionalLaw.decreto})` : 'LOMLOE Nacional'}</strong>.
          </p>
        </div>
        <button
          onClick={handleExportSdaMarkdown}
          className="px-5 py-2.5 rounded-full bg-google-blue hover:bg-google-blue-hover text-white text-xs font-black shadow-md flex items-center justify-center gap-1.5 transition-all flex-shrink-0"
        >
          <span className="material-symbols-outlined text-sm">download</span>
          <span>Exportar SdA (.md)</span>
        </button>
      </div>

      {/* Grid Principal */}
      <div className="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">

                    "inicial": "Descriptor nivel inicial (1 pt o No)"
                  }
                ]
                (Genera entre 3 y 4 criterios relevantes para el tema y la edad).
                
                Para tipo "holistic":
                Genera un único objeto en el array con el id 1 que evalúe globalmente la tarea:
                [
                  {
                    "id": 1,
                    "criterio": "Evaluación Global: ${topic}",
                    "comp": "CCL",
                    "excelente": "Criterios globales para Sobresaliente (9-10)",
                    "bueno": "Criterios globales para Notable (7-8)",
                    "desarrollo": "Criterios globales para Suficiente/Bien (5-6)",
                    "inicial": "Criterios globales para Insuficiente (1-4)"
                  }
                ]
                `
              }]
            }]
          })
        });
        
        if (response.ok) {
          const data = await response.json();
          const rawText = data.candidates?.[0]?.content?.parts?.[0]?.text || '';
          const cleanedText = rawText.replace(/```json/g, '').replace(/```/g, '').trim();
          const parsed = JSON.parse(cleanedText);
          if (Array.isArray(parsed) && parsed.length > 0) {
            setRubricRows(parsed);
            const newScores = {};
            parsed.forEach(r => { newScores[r.id] = 4; });
            setScores(newScores);
            setIsGenerating(false);
            if (window.confetti) window.confetti({ particleCount: 50, spread: 35 });
            return;
          }
        }
      } catch (err) {
        console.error("Error generating rubric with Gemini API, falling back to local:", err);
      }
    }
    
    const local = generateLocalRubric(topic, rubricStage, rubricType);
    setRubricRows(local);
    const newScores = {};
    local.forEach(r => { newScores[r.id] = 4; });
    setScores(newScores);
    setIsGenerating(false);
    if (window.confetti) window.confetti({ particleCount: 50, spread: 35 });
  };

  // Rúbrica interactiva por defecto
  const [rubricRows, setRubricRows] = useState([

      desarrollo: 'Presenta un diseño desordenado, texto excesivo o imágenes pixeladas poco descriptivas.',

      desarrollo: 'Trabaja de forma muy independiente, interactuando lo mínimo con los compañeros.',
      inicial: 'No colabora ni se coordina con su grupo, retrasando la entrega del producto didáctico.'

  // Puntuación asignada a cada fila (1, 2, 3 o 4)
  const [scores, setScores] = useState({
    1: 4,
    2: 3,
    3: 3,
    4: 4
  });

  const handleCellClick = (rowId, score) => {
    setScores(prev => ({ ...prev, [rowId]: score }));
  };

  // Cálculo de notas
  const stats = useMemo(() => {
    const rowIds = Object.keys(scores);
    if (rowIds.length === 0) return { rawAverage: 0, finalGrade: 0, qual: 'Sin evaluar' };
    
    let sum = 0;
    rowIds.forEach(id => {
      sum += scores[id];
    });
    
    const rawAverage = sum / rowIds.length;
    // Escalar sobre 10 (la nota máxima posible es 4, el promedio sobre 4 se multiplica por 2.5)
    const finalGrade = Math.round((rawAverage * 2.5) * 10) / 10;
    
    let qual = 'Insuficiente (IN)';
    if (finalGrade >= 9) qual = 'Sobresaliente (SB) 🏆';
    else if (finalGrade >= 7) qual = 'Notable (NT) ⭐';
    else if (finalGrade >= 5) qual = 'Suficiente/Bien (SU/BI)';
    
    return { rawAverage, finalGrade, qual };
  }, [scores]);

  // Mapear promedio por competencias clave
  const competencyStats = useMemo(() => {
    const compMap = {};
    rubricRows.forEach(row => {
      const score = scores[row.id] || 1;
      const compId = row.comp;
      if (!compMap[compId]) {
        compMap[compId] = [];
      }
      compMap[compId].push(score);
    });

    const results = [];
    Object.keys(compMap).forEach(compId => {
      const scoreList = compMap[compId];
      const avg = scoreList.reduce((a, b) => a + b, 0) / scoreList.length;
      const percentage = Math.round((avg / 4) * 100);
      const compData = LOMLOE_COMPETENCIES.find(c => c.id === compId);
      results.push({
        id: compId,
        name: compData ? compData.name.split(' ')[0] : compId,
        flag: compData ? compData.flag : '🎯',
        percentage,
        color: percentage >= 85 ? 'bg-google-green' : percentage >= 65 ? 'bg-google-blue' : percentage >= 50 ? 'bg-google-yellow' : 'bg-google-red'
      });
    });
    return results;
  }, [scores, rubricRows]);

  // Generar feedback por IA

    feedback += `**Calificación Final:** ${stats.finalGrade} / 10 (${stats.qual})\n`;
    feedback += `\n---\n\n`;
    
    feedback += `#### 🔍 DESGLOSE DE CRITERIOS ALCANZADOS:\n`;
    rubricRows.forEach(row => {
      const score = scores[row.id] || 1;
      const levelLabel = score === 4 ? 'Excelente' : score === 3 ? 'Bueno' : score === 2 ? 'En Desarrollo' : 'Inicial';
      const cellText = score === 4 ? row.excelente : score === 3 ? row.bueno : score === 2 ? row.desarrollo : row.inicial;
      feedback += `- **${row.criterio}** (${row.comp}): Nivel **${levelLabel}** (${score}/4 puntos).\n  *Detalle: ${cellText}*\n`;
    });
    
    feedback += `\n#### 🚀 EVALUACIÓN FORMATIVA Y FEEDFORWARD (Siguiente Paso):\n`;

      feedback += `Buen trabajo, ${studentName}. La exposición y contenidos están bien estructurados. Para futuras tareas, te recomiendo prestar más atención al diseño del soporte digital simplificando los textos en pantalla y ensayando la oratoria previamente para evitar vacilaciones.`;

    return feedback;

              <span className="text-[10px] text-google-gray-textSec dark:text-google-gray-border block font-bold mt-0.5">sobre 10</span>
            </div>

            <div className="text-xs font-black uppercase text-google-blue-medium dark:text-white">
              {stats.qual}
            </div>

            {/* Rendimiento por Competencia Clave */}
            <div className="space-y-3 pt-3 border-t border-google-gray-border/10">
              <h4 className="text-[10px] font-bold text-google-gray-textSec dark:text-google-gray-border uppercase tracking-wider text-left">Logro por Competencias</h4>
              
              <div className="space-y-2.5">
                {competencyStats.map(comp => (
                  <div key={comp.id} className="space-y-1">
                    <div className="flex justify-between text-[8px] font-bold text-google-gray-text dark:text-white">

                      <div className={`h-full rounded-full ${comp.color}`} style={{ width: `${comp.percentage}%` }} />
                    </div>
                  </div>
                ))}
              </div>
            </div>
          </div>

          {/* Informe de Feedback Formativo */}
          <div className="bg-white dark:bg-google-gray-darkSurface rounded-3xl border border-google-gray-border/25 dark:border-google-gray-darkInput p-6 shadow-sm space-y-4">
            <div className="flex items-center justify-between border-b border-google-gray-border/10 pb-2.5">
              <h3 className="font-extrabold text-xs text-google-gray-text dark:text-white uppercase tracking-wider">Informe de Feedback</h3>
              <button
                onClick={handleCopyFeedback}
                className="text-google-blue hover:underline text-[10px] font-black flex items-center gap-0.5 cursor-pointer"
              >
                <span className="material-symbols-outlined text-xs">content_copy</span>
                <span>Copiar</span>
              </button>
            </div>

            <div className="p-4 bg-google-gray-bg dark:bg-google-gray-darkBg rounded-2xl border border-google-gray-border/20 max-h-[220px] overflow-y-auto custom-scrollbar text-[9px] font-mono whitespace-pre-wrap leading-relaxed text-google-gray-textSec dark:text-[#c7c7c7]">
              {generatedFeedback}
            </div>
          </div>

        </div>

      </div>

    </div>
  );
}
